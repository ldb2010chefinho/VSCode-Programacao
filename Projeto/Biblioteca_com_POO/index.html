<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="src/main.js" defer></script>
</head>
<body>

    <div id="container">
        <h1>Cadastro de Acervo Bibliográfico</h1>
        <p>Escolha o tipo de material a ser cadastrado:</p>

        <form id="meu_Form">
            <label for="tipo">Tipo de Material:</label>

            <select id="tipo" name="tipo" required>
                <option value="livro">Livro</option>
                <option value="revista">Revista</option>
            </select>

            <div id="esconder-div">
                <div id="opcoes">

                    <label for="isbn">ISBN/ISSN:</label>
                    <input type="text" id="isbn" name="isbn"><br><br>

                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" name="titulo" required><br><br>
    
                    <label for="autor">Autor:</label>
                    <input type="text" id="autor" name="autor" required><br><br>
                    
                    <label for="volume">Volume:</label>
                    <input type="text" id="volume" name="volume"><br><br>

                    <label for="editora">Editora:</label>
                    <input type="text" id="editora" name="editora"><br><br>

                    <label for="local">Local:</label>
                    <input type="text" id="local" name="local"><br><br>
                    
                    <label for="numeracao">Numeração:</label>
                    <input type="text" id="numeracao" name="numeracao"><br><br>

                    <label for="ano">Ano de Publicação:</label>
                    <input type="number" id="ano" name="ano" required><br><br>
    
                    <input type="submit" value="Cadastrar" id="btn_enviar">
                </div>

            </div>
            <ul id="itens-list"></ul>
    </div>
</body>
</html>
