<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Btn Animado</title>
    <style>
        #btn{
            background-color: darkgreen;
            border: 2px solid lightgreen;
            border-radius: 10px;
            font-size: 25px;
            margin-top: 5px;
            margin-left: 5px;
            text-align: center;
            animation: pulsar 3s infinite;
            width: 300px;
            height: 200px;
        }


        @keyframes pulsar {
            0% {width: 300px; height: 200px;}
            50% {width: 600px; height: 400px;}
            100% {width: 300px; height: 200px;}
        }
    </style>
</head>
<body>
    <button id="btn">Botão Pulsante</button>
</body>
</html>
