<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <link rel="stylesheet" href="style.css">

    <title>Calculadora</title>

    <script src="script.js" defer></script>
</head>

<body>
    <div id="conteiner">
        <h1>Calculadora de movimento</h1>

        <hr>
        <form id="meu_form">
            
            <div id="escolha">
                <label for="tipo">Escolha o tipo de movimento:</label>
                <select id="tipo" required>
                    <option value=""></option>
                    <option value="mru">MRU</option>
                    <option value="mruv1">MRUV1</option>
                    <option value="mruv2">MRUV2</option>
                    <option value="mruv3">MRUV3</option>
                </select>
            </div>
    
            <br>
    
            <div id="entradaValores">
                <label id="label_espaco" for="Espaço">Espaço</label>
                <input id="espaco" type="number">
    
                <br>
    
                <label id="label_espaco_inicial" for="EspaçoInicial">
                    Espaço Inicial
                </label>
                <input id="espaco_inicial" type="number">
    
                <br>
    
                <label id="label_posicao_inicial" for="PosiçãoInicial">
                    Posição Inicial
                </label>
                <input id="posicao_inicial" type="number">
    
                <br>
    
                <label id="label_posicao" for="Posição">Posição</label>
                <input id="posicao" type="number">
    
                <br>
    
                <label id="label_velocidade_inicial" for="VelocidadeInicial">
                    Velocidade Inicial
                </label>
                <input id="velocidade_inicial" type="number">
    
                <br>
    
                <label id="label_velocidade" for="Velocidade">
                    Velocidade
                </label>
                <input id="velocidade" type="number">
    
                <br>
    
                <label id="label_tempo" for="Tempo">Tempo</label>
                <input id="tempo" type="number">
    
                <br>
    
                <label id="label_aceleracao" for="aceleracao">
                    Aceleração
                </label>
                <input id="aceleracao" type="number">
    
                <br>
    
                <label id="label_variacaoEspaco" for="variacaoEspaco">
                    Variação do Espaço
                </label>
                <input id="variacaoEspaco" type="number">
    
                <br>
    
                <input type="submit" id="btn_enviar" value="Enviar">
            </div>
        </form>

    <canvas id="grafico"></canvas>    
</div>
</body>
</html>
